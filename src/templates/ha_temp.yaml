# Template für Home Assistant Temperatur-Sensor Widget (LVGL Card)
# Variablen: temp, col, row, icon_color (optional)
# Der Anzeigename wird dynamisch aus dem Text-Sensor ha_entity_${temp}_friendly_name gelesen
# Temperatur- und Feuchtewerte werden über die Labels ha_temp_value_${temp} / ha_temp_value_${hum} aktualisiert
# Design: Glassmorphism Card mit farbigem Thermometer-Icon links, Name + Wert rechts

defaults:
  temp: "8"
  hum: "9"
  col: "0"
  row: "0"

obj:
  id: temp_card_${temp}
  grid_cell_column_pos: ${col}
  grid_cell_row_pos: ${row}
  grid_cell_x_align: STRETCH
  grid_cell_y_align: STRETCH
  # WICHTIG: Explizite Groesse (kein SIZE_CONTENT-Default), damit grid_update
  # NICHT lv_obj_refr_size aufruft und das Layout re-invalidiert. Nur so ist
  # grid_row_align: CENTER stabil (sonst pendelt die zentrierte Position in
  # LVGL 9.5 -> Task-WDT). Tatsaechliche Groesse kommt weiterhin per STRETCH
  # aus der Grid-Zelle; der 100%-Wert dient nur dem refr_size-Check.
  width: 100%
  height: 100%
  # Glassmorphism Card Styling
  radius: 24
  bg_color: color_gray_800
  bg_opa: 60%
  border_color: color_gray_600
  border_width: 1
  border_opa: 20%
  shadow_width: 16
  shadow_offset_y: 6
  shadow_color: color_black
  shadow_opa: 35%
  pad_all: 16
  scrollbar_mode: "OFF"
  # Grid Layout: eine Kopfzeile oben, darunter ein eigener Messwert-Block.
  # So bleiben Titel und Werte getrennt und ueberlappen nicht.
  layout:
    type: GRID
    grid_columns: [FR(1)]
    grid_rows: [SIZE_CONTENT, FR(1)]
    grid_row_align: START
    pad_row: 18
  widgets:
    # Raumname als klare Kopfzeile oben
    - label:
        id: ha_sensor_label_${temp}
        grid_cell_column_pos: 0
        grid_cell_row_pos: 0
        width: 100%
        grid_cell_x_align: START
        grid_cell_y_align: START
        text: !lambda |-
          if (id(ha_entity_${temp}_room).has_state()) {
            return id(ha_entity_${temp}_room).state;
          }
          return std::string("Sensor ${temp}");
        text_font: roboto16
        text_color: color_gray_300
        long_mode: dot
    # Messwert-Block im verbleibenden Kartenbereich
    - obj:
        grid_cell_column_pos: 0
        grid_cell_row_pos: 1
        grid_cell_x_align: CENTER
        grid_cell_y_align: CENTER
        width: SIZE_CONTENT
        height: SIZE_CONTENT
        bg_opa: TRANSP
        border_opa: TRANSP
        pad_all: 0
        layout:
          type: FLEX
          flex_flow: ROW
          flex_align_main: START
          flex_align_cross: CENTER
          pad_column: 12
        widgets:
          - label:
              id: temp_icon_${temp}
              width: 48
              text_align: CENTER
              text: "\U000F050F"
              text_font: btn_icons_font
              text_color: color_gray_500
          - obj:
              bg_opa: TRANSP
              border_opa: TRANSP
              pad_all: 0
              width: SIZE_CONTENT
              height: SIZE_CONTENT
              layout:
                type: FLEX
                flex_flow: COLUMN
                flex_align_main: CENTER
                flex_align_cross: START
                pad_row: 2
              widgets:
                - label:
                    id: ha_temp_value_${temp}
                    text: "-- °C"
                    text_font: roboto24
                    text_color: color_white
                - obj:
                    bg_opa: TRANSP
                    border_opa: TRANSP
                    pad_all: 0
                    width: SIZE_CONTENT
                    height: SIZE_CONTENT
                    layout:
                      type: FLEX
                      flex_flow: ROW
                      flex_align_main: START
                      flex_align_cross: CENTER
                    widgets:
                      - label:
                          text: "\U000F058C"
                          text_font: mdi_icons_24
                          text_color: color_info
                          pad_right: 6
                      - label:
                          id: ha_temp_value_${hum}
                          text: "-- %"
                          text_font: roboto16
                          text_color: color_gray_300



                    
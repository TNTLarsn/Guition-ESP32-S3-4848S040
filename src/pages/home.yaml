lvgl:
  pages:
    # ========================================================================
    # HOME PAGE - Modern Hero Layout
    # ========================================================================
    # Design-Konzept: Große Uhrzeit als Hero, Wetter als Accent,
    # Datum als Subtitle - klare visuelle Hierarchie
    # ========================================================================
    - id: home_page
      bg_color: color_bg_dark
      widgets:
        # Hidden placeholder für ha_sensor_label_8 (wird nur für Templates benötigt)
        - label:
            id: ha_sensor_label_8
            hidden: true
        # Hintergrundbild (dynamisch basierend auf Jahreszeit, Default: Sommer)
        - image:
            id: home_bg_image
            align: CENTER
            src: see_summer_img
        
        # Hauptcontainer mit Grid Layout
        - obj:
            id: home_main_container
            layout:
              type: GRID
              grid_columns: [FR(1)]
              grid_rows: [56, FR(1)]
            width: 100%
            height: ${content_height}
            pad_all: 0
            bg_opa: TRANSP
            border_opa: TRANSP
            widgets:
              
              # ============================================================
              # TOP BAR - Wetter & Status (mit Glassmorphism Backdrop)
              # ============================================================
              - obj:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 0
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: START
                  width: 100%
                  height: 56
                  pad_left: 16
                  pad_right: 16
                  pad_top: 12
                  bg_color: color_bg_dark
                  bg_opa: 70%
                  border_opa: TRANSP
                  scrollbar_mode: "OFF"
                  layout:
                    type: GRID
                    grid_columns: [FR(1), FR(1)]
                    grid_rows: [FR(1)]
                  widgets:
                    # Wetter Info (links)
                    - obj:
                        grid_cell_column_pos: 0
                        grid_cell_row_pos: 0
                        grid_cell_x_align: START
                        grid_cell_y_align: CENTER
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_opa: TRANSP
                        # FLEX statt GRID: GRID hat in LVGL 9.5 KEINEN min_size_cb
                        # (lv_grid.c:147 = NULL). Dadurch faellt calc_content_width
                        # bei width:SIZE_CONTENT auf eine zirkulaere Kind-Koordinaten-
                        # Berechnung zurueck -> oszilliert -> Task-WDT. FLEX besitzt
                        # einen min_size_cb (lv_flex.c:105) und konvergiert sofort.
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: START
                          flex_align_cross: CENTER
                          pad_column: 10
                        widgets:
                          - label:
                              id: homeassistant_btn_7_icon
                              width: 36
                              text_align: CENTER
                              text: "\U000F0599"
                              text_color: color_secondary
                              text_font: weather_icons
                          - label:
                              id: homeassistant_btn_7_label
                              text: "-- °C --"
                              text_font: roboto24
                              text_color: color_white
                    
                    # Innentemperatur (rechts)
                    - obj:
                        grid_cell_column_pos: 1
                        grid_cell_row_pos: 0
                        grid_cell_x_align: END
                        grid_cell_y_align: CENTER
                        width: SIZE_CONTENT
                        height: SIZE_CONTENT
                        bg_opa: TRANSP
                        border_opa: TRANSP
                        # FLEX statt GRID (siehe Begruendung oben): vermeidet den
                        # SIZE_CONTENT-Layout-WDT, da FLEX einen min_size_cb hat.
                        layout:
                          type: FLEX
                          flex_flow: ROW
                          flex_align_main: END
                          flex_align_cross: CENTER
                          pad_column: 8
                        widgets:
                          - label:
                              text: "\U000F050F"
                              text_color: color_primary_light
                              text_font: mdi_icons_24
                          - label:
                              id: ha_temp_value_8
                              text: "-- °C"
                              text_font: roboto24
                              text_color: color_white

              # ============================================================
              # HERO SECTION - Uhrzeit & Datum (oberer Bereich)
              # Spacing-Prinzip: Zusammengehörige Elemente haben engen Abstand
              # ============================================================
              - obj:
                  grid_cell_column_pos: 0
                  grid_cell_row_pos: 1
                  grid_cell_x_align: CENTER
                  grid_cell_y_align: START
                  width: SIZE_CONTENT
                  height: SIZE_CONTENT
                  bg_opa: TRANSP
                  border_opa: TRANSP
                  scrollbar_mode: "OFF"
                  pad_top: 24
                  # FLEX statt GRID (siehe Begruendung oben): GRID ohne min_size_cb
                  # erzeugt bei width/height:SIZE_CONTENT die nicht-konvergierende
                  # Layout-Schleife (Task-WDT). FLEX ist deterministisch.
                  # Die feste 90px-Hoehe der Uhrzeit (frueher grid_rows[0]) wandert
                  # als height aufs Label -> visuell identisch.
                  layout:
                    type: FLEX
                    flex_flow: COLUMN
                    flex_align_main: START
                    flex_align_cross: CENTER
                    pad_row: 0
                  widgets:
                    # Große Uhrzeit - HERO Element
                    - label:
                        id: display_time
                        height: 90
                        text_align: CENTER
                        text: !lambda |-
                          auto now = id(sntp_time).now();
                          if (!now.is_valid()) return std::string("--:--");
                          return DateTimeHelper::format_time_simple(now.hour, now.minute);
                        text_font: roboto90
                        text_color: color_gray_800
                    
                    # Datum - Subheading (direkt unter Uhrzeit)
                    - label:
                        text_align: CENTER
                        y: -12
                        id: display_date
                        text: !lambda |-
                          auto now = id(sntp_time).now();
                          if (!now.is_valid()) return std::string("---");
                          return DateTimeHelper::format_date_short(now.day_of_month, now.month, now.year);
                        text_font: roboto24
                        text_color: color_gray_700
